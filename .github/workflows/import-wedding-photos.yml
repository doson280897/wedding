name: Import wedding album from config
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download selected original photos from shared Drive
        run: |
          python -m pip install --quiet gdown Pillow pillow-avif-plugin
          mkdir -p images/original/album
          python - <<'PY'
          import gdown
          from pathlib import Path
          import json
          import re
          source = Path("wedding-info.js").read_text(encoding="utf-8")
          match = re.search(r"window\.WEDDING_INFO\s*=\s*", source)
          if not match:
              raise RuntimeError("wedding-info.js has no window.WEDDING_INFO")
          config, _ = json.JSONDecoder().raw_decode(source[match.end():].lstrip())
          items = config.get("gallery", {}).get("imports", [])
          if not isinstance(items, list):
              raise ValueError("gallery.imports must be a list")
          for item in items:
              name = item.get("name", "")
              file_id = item.get("fileId", "")
              if not file_id or Path(name).name != name or not re.fullmatch(r"[\w. -]+\.(?:jpg|jpeg|png|webp|avif)", name, re.I):
                  raise ValueError("Invalid gallery.imports entry: " + repr(name))
              path = Path("images/original/album") / name
              if path.exists():
                  continue
              gdown.download(id=file_id, output=str(path), quiet=False)
              if not path.exists() or path.stat().st_size < 10000:
                  raise RuntimeError("Drive download failed: " + name + "; check link-sharing permissions")
      - name: Optimize with existing Python generator
        run: python generate_gallery.py
      - name: Commit optimized WebP files and merged manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/optimized/album images/manifest.json
          if git diff --cached --quiet; then
            echo "No new optimized images"
          else
            git commit -m "Add 20 optimized wedding photos without replacing existing album"
            git push
          fi
