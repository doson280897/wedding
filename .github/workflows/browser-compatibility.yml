name: Cross-device browser compatibility

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      extended:
        description: Run the full eight-device browser matrix
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install -r requirements.txt
      - name: Check source and configuration
        run: |
          npm run format:check
          npm test
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 -m py_compile generate_gallery.py scripts/build-social-preview.py
      - name: Build the actual public artifact
        run: npm run build
        env:
          BUILD_SHA: ${{ github.sha }}
      - name: Install browser engines
        run: |
          if [ "$WEDDING_EXTENDED_TESTS" = "true" ]; then
            npx playwright install --with-deps chromium webkit firefox
          else
            npx playwright install --with-deps chromium webkit
          fi
        env:
          WEDDING_EXTENDED_TESTS: ${{ inputs.extended || 'false' }}
      - name: Test the built site
        run: npm run test:browser
        env:
          CI: "true"
          WEDDING_EXTENDED_TESTS: ${{ inputs.extended || 'false' }}
      - name: Preserve the tested public artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-wedding-site
          path: dist/
          retention-days: 7
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
