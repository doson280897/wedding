name: Format source code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install formatters
        run: |
          npm install --no-save --no-package-lock prettier@3.6.2
          python -m pip install black==25.9.0

      - name: Format web source, config and documentation
        run: |
          ./node_modules/.bin/prettier --write \
            index.html link-tool.html \
            style.css quick-nav.css link-tool.css \
            script.js quick-nav.js gallery.js i18n.js link-tool.js wedding-info.js \
            build-wedding.cjs playwright.config.cjs tests/*.cjs \
            .github/workflows/deploy.yml \
            .github/workflows/import-wedding-photos.yml \
            .github/workflows/format-source.yml \
            .github/workflows/browser-compatibility.yml \
            .prettierrc.json README.md images/manifest.json
          black generate_gallery.py

      - name: Validate JavaScript and Python syntax
        run: |
          node --check script.js
          node --check quick-nav.js
          node --check gallery.js
          node --check i18n.js
          node --check wedding-info.js
          node --check link-tool.js
          node --check build-wedding.cjs
          node --test tests/data-source.test.cjs
          python -m py_compile generate_gallery.py
          python -m json.tool images/manifest.json > /dev/null

      - name: Formatting completed
        run: |
          echo 'Formatting and syntax checks completed in the runner. No push attempted.'
